name: Verificación de CaseWorkspace

on:
  pull_request:
    paths:
      - 'app/quejas/**'
      - 'lib/queries/useQuejaInvestigationAssignment.ts'
      - 'lib/queries/useQuejaResolucionDraft.ts'
      - 'lib/services/quejaWorkflowService.ts'
      - 'supabase/migrations/*quejas_investigacion_asignacion.sql'
      - 'tests/quejas-asignacion-investigacion.test.mjs'
      - 'tests/queja-publicacion.test.mjs'
      - 'tests/entity-request-guard.test.mjs'
      - 'tests/visual-contracts.test.mjs'
      - 'app/mis-quejas/**'
      - 'app/usuarios/**'
      - 'tests/usuarios-table-layout.test.mjs'
      - 'tests/usuarios-acciones-menu.test.mjs'
      - 'components/Modal.tsx'
      - 'tests/quejas-progressive-disclosure.test.mjs'
      - 'docs/visual-patterns.md'
      - 'AGENTS.md'
      - '.github/workflows/qms-workspace-verify.yml'

jobs:
  qms-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --test tests/quejas-progressive-disclosure.test.mjs tests/quejas-panel-reference.test.mjs tests/queja-publicacion.test.mjs tests/entity-request-guard.test.mjs tests/visual-contracts.test.mjs tests/mis-quejas-workspace.test.mjs tests/quejas-stepper-consulta.test.mjs tests/usuarios-table-layout.test.mjs tests/usuarios-acciones-menu.test.mjs tests/quejas-asignacion-investigacion.test.mjs tests/quejas-ui-refinada.test.mjs tests/usuarios-acceso-workflow.test.mjs
      - run: npm run build
        env:
          # Datos públicos ficticios: permiten prerenderizar sin conectar CI a Supabase real.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-sin-credenciales-reales
      - run: npm run check:structure
      - run: npm run check:visual

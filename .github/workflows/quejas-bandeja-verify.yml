name: Verificación de bandeja Quejas

on:
  pull_request:
    paths:
      - 'app/quejas/**'
      - 'app/mis-quejas/**'
      - 'components/quejas/**'
      - 'components/Sidebar.tsx'
      - 'hooks/useRealtimeSubscription.ts'
      - 'lib/queries/useQuejas.ts'
      - 'lib/utils/quejaDeadline.ts'
      - 'lib/types.ts'
      - 'supabase/migrations/*quejas_bandeja*.sql'
      - 'tests/queja-deadline.test.mjs'
      - 'tests/quejas-bandeja.test.mjs'
      - 'tests/pagination-active.test.mjs'
      - 'tests/data-reliability.test.mjs'
      - 'scripts/test-quejas-bandeja-db.mjs'
      - 'tests/fixtures/quejas-bandeja-schema.sql'
      - '.github/workflows/quejas-bandeja-verify.yml'

permissions:
  contents: read

jobs:
  bandeja:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --test tests/queja-deadline.test.mjs tests/quejas-bandeja.test.mjs tests/pagination-active.test.mjs tests/data-reliability.test.mjs
      - run: npm install --no-save pg@8.16.3
      - run: node scripts/test-quejas-bandeja-db.mjs
        env:
          QMS_PG_URL: postgresql://fixture:fixture@127.0.0.1:5432/postgres
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-sin-credenciales-reales
